<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Barra 1 (Início da Energia) -->
    <linearGradient id="l5-b1" x1="42" y1="95" x2="65" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Gradiente Barra 2 (Aceleração Central) -->
    <linearGradient id="l5-b2" x1="62" y1="105" x2="88" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Gradiente Barra 3 (Apex / Vanguarda) -->
    <linearGradient id="l5-b3" x1="82" y1="115" x2="115" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Arco de Aceleração -->
    <linearGradient id="l5-arc" x1="35" y1="110" x2="125" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: Lâminas Angulares de Propulsão para o Futuro -->
  <g>
    <!-- Barra 1: Impulso Inicial -->
    <polygon points="40,88 56,58 66,58 50,88" fill="url(#l5-b1)"/>

    <!-- Barra 2: Potência Contínua -->
    <polygon points="60,98 80,48 91,48 71,98" fill="url(#l5-b2)"/>

    <!-- Barra 3: Vanguarda & Olhar para Frente -->
    <polygon points="81,108 106,38 118,38 93,108" fill="url(#l5-b3)"/>

    <!-- Arco de Propulsão Dinâmica cortando as bases -->
    <path d="M36 102C56 112 88 114 124 88" stroke="url(#l5-arc)" stroke-width="3" stroke-linecap="round"/>

    <!-- Vetor de Direcionamento -->
    <polygon points="126,84 134,88 126,92" fill="#818CF8"/>
  </g>

  <!-- Tipografia -->
  <text x="146" y="80" font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="0.07em" fill="#0F172A">
    SINERGIA
  </text>
  <text x="148" y="104" font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.26em" fill="#4F46E5">
    INOVAÇÃO &amp; POTÊNCIA
  </text>
  <rect x="148" y="113" width="42" height="2.5" rx="1.25" fill="#2563EB"/>
  <rect x="194" y="113" width="16" height="2.5" rx="1.25" fill="#818CF8"/>
</svg>

