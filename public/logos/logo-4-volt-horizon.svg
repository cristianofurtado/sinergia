<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente do Raio de Alta Tensão -->
    <linearGradient id="l4-volt" x1="50" y1="35" x2="110" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Gradiente da Asa de Voo / Visão de Futuro -->
    <linearGradient id="l4-wing" x1="30" y1="75" x2="125" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: Raio Angular em Propulsão para a Frente -->
  <g>
    <!-- Asa Tecnológica Superior / Voo Futuro -->
    <path d="M38 52L102 52L124 38L62 38L38 52Z" fill="url(#l4-wing)"/>

    <!-- Raio Central Angulado com Corte Preciso -->
    <polygon points="76,38 46,84 74,84 56,118 108,68 80,68 100,38" fill="url(#l4-volt)"/>

    <!-- Linha de Esteira Inferior em Perspectiva -->
    <path d="M54 118L118 118L130 106L68 106L54 118Z" fill="#94A3B8" fill-opacity="0.3"/>

    <!-- Ponto Laser Direcional -->
    <circle cx="128" cy="74" r="3" fill="#EA580C"/>
  </g>

  <!-- Tipografia -->
  <text x="146" y="80" font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="0.09em" fill="#0F172A">
    SINERGIA
  </text>
  <text x="148" y="104" font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.28em" fill="#EA580C">
    ENGENHARIA &amp; EFICIÊNCIA
  </text>
  <rect x="148" y="113" width="54" height="2.5" rx="1.25" fill="#1E3A8A"/>
  <rect x="206" y="113" width="14" height="2.5" rx="1.25" fill="#F59E0B"/>
</svg>

