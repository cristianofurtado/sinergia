<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Principal de Propulsão -->
    <linearGradient id="l1-primary" x1="25" y1="35" x2="115" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Gradiente de Centelha Solar / Olhar pra Frente -->
    <linearGradient id="l1-spark" x1="60" y1="40" x2="125" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="l1-glow" x1="40" y1="75" x2="120" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <filter id="l1-soft-shadow" x="15" y="20" width="120" height="110" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Símbolo: Três Chevrons de Energia e Velocidade -->
  <g filter="url(#l1-soft-shadow)">
    <!-- Base Glow -->
    <ellipse cx="75" cy="75" rx="42" ry="42" fill="url(#l1-glow)"/>

    <!-- Chevron 1: Base de Potência -->
    <path d="M36 45L62 75L36 105C33.8 107.5 37.2 110.8 39.8 108.2L70 77.8C71.4 76.4 71.4 73.6 70 72.2L39.8 41.8C37.2 39.2 33.8 42.5 36 45Z" fill="#94A3B8" fill-opacity="0.35"/>

    <!-- Chevron 2: Fluxo Central -->
    <path d="M54 43L84 75L54 107C51.5 109.8 55.4 113.2 58.2 110.4L92.2 78C93.8 76.4 93.8 73.6 92.2 72L58.2 39.6C55.4 36.8 51.5 40.2 54 43Z" fill="url(#l1-primary)"/>

    <!-- Chevron 3: Ponta de Vanguarda & Olhar para Frente -->
    <path d="M74 41L108 75L74 109C71.2 112 75.6 115.8 78.8 112.6L117.2 78.2C118.8 76.6 118.8 73.4 117.2 71.8L78.8 37.4C75.6 34.2 71.2 38 74 41Z" fill="url(#l1-spark)"/>

    <!-- Núcleo de Energia (Ponto de Foco) -->
    <circle cx="121" cy="75" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Tipografia Institucional -->
  <!-- Logotipo Principal -->
  <text x="146" y="81" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="0.06em" fill="#0F172A">
    SINERGIA
  </text>

  <!-- Subtítulo / Posicionamento -->
  <text x="148" y="105" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.26em" fill="#0284C7">
    ENERGIA &amp; TRANSFORMAÇÃO
  </text>

  <!-- Linha de Aceleração -->
  <rect x="148" y="114" width="46" height="2.5" rx="1.25" fill="#F59E0B"/>
  <rect x="198" y="114" width="12" height="2.5" rx="1.25" fill="#0284C7"/>
  <circle cx="215" cy="115.25" r="1.5" fill="#0284C7"/>
</svg>

